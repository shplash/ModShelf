name: ModShelf

options:
  bundleIdPrefix: com.shplash

deploymentTarget:
  iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  WorkshopDownloader:
    type: application
    platform: iOS
    sources:
      - Sources
    # A real Info.plist is required here: UIFileSharingEnabled has no INFOPLIST_KEY_ build
    # setting, so with a generated plist it was silently dropped and ModShelf never showed up
    # in Files. The empty UILaunchScreen is what stops iOS letterboxing the app at a legacy
    # resolution (the wrong aspect on newer iPhones).
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ModShelf
        CFBundleShortVersionString: "0.1b"
        CFBundleVersion: "30"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - framework: SteamEngine.xcframework
        embed: true
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shplash.modshelf
        PRODUCT_NAME: ModShelf
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1b"
        CURRENT_PROJECT_VERSION: "30"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
