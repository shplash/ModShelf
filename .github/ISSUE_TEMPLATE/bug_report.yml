name: Bug report
description: Report a problem with ModShelf
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the issue
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Device model

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: iOS 18.6.2

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - SideStore
        - AltStore
        - TrollStore
        - LiveContainer
        - Other

  - type: input
    id: version
    attributes:
      label: ModShelf version
      placeholder: 1.0 (build 90), shown in Options → About

  - type: input
    id: mod
    attributes:
      label: Mod or game
      placeholder: Workshop link or item ID, and the game

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do just before it went wrong?

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      placeholder: Paste screenshots or logs here
