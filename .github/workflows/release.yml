name: Release ModShelf

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, without the v (e.g. 1.1.2)
        required: true
      notes:
        description: Release notes (Markdown). Shown on the release, in the app's update check and on the alt source.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: modshelf-release
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  GOTOOLCHAIN: auto

jobs:
  build:
    name: Build, tag and publish
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "ERROR: '$VERSION' is not a version number like 1.1.2."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: a release called v$VERSION already exists."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set the version in the project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          with open("project.yml", encoding="utf-8") as handle:
              text = handle.read()
          updated, count = re.subn(r'MARKETING_VERSION: "[^"]*"', f'MARKETING_VERSION: "{version}"', text, count=1)
          if count == 0:
              sys.exit("MARKETING_VERSION is missing from project.yml")
          if updated != text:
              with open("project.yml", "w", encoding="utf-8") as handle:
                  handle.write(updated)
          PY
          if git diff --quiet -- project.yml; then
            echo "project.yml already says $VERSION."
          else
            git config user.name "shplash-bot"
            git config user.email "actions@github.com"
            git add project.yml
            git commit -m "Release v$VERSION"
            git push
          fi

      - name: Restore SteamEngine.xcframework
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: SteamEngine.xcframework
          key: steamengine-${{ runner.os }}-${{ hashFiles('ios-engine/**') }}

      - name: Set up Go
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ios-engine/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: ios-engine/go.*

      - name: Install gomobile
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialise gomobile
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: gomobile init

      - name: Build the Steam engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: ios-engine
        run: |
          go get github.com/BirknerAlex/go-steam@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile bind -v -target=ios -o ../SteamEngine.xcframework .

      - name: Fix the engine framework's minimum OS version
        run: |
          set -euo pipefail
          test -d SteamEngine.xcframework
          patched=0
          for framework in SteamEngine.xcframework/*/SteamEngine.framework; do
            [ -d "$framework" ] || continue
            plist="$framework/Info.plist"
            [ -f "$plist" ] || continue
            /usr/bin/plutil -replace MinimumOSVersion -string "16.0" "$plist"
            /usr/bin/codesign --force --sign - --timestamp=none "$framework"
            patched=$((patched + 1))
          done
          if [ "$patched" -eq 0 ]; then
            echo "ERROR: no SteamEngine.framework slice was found to patch."
            exit 1
          fi

      - name: Restore the Homebrew cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-xcodegen
          restore-keys: homebrew-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Set the build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Restore Swift packages and build output
        uses: actions/cache@v6
        with:
          path: |
            build/SourcePackages
            build/Build
          key: xcodebuild-${{ runner.os }}-${{ hashFiles('project.yml', 'Sources/**') }}
          restore-keys: xcodebuild-${{ runner.os }}-

      - name: Build the app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ModShelf.xcodeproj \
            -scheme WorkshopDownloader \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package and sign the IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ModShelf.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App bundle not found: $APP_PATH"
            find build/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          rm -rf Payload ModShelf.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ModShelf.app

          for framework in Payload/ModShelf.app/Frameworks/*.framework; do
            [ -d "$framework" ] || continue
            plist="$framework/Info.plist"
            [ -f "$plist" ] || continue
            /usr/bin/plutil -replace MinimumOSVersion -string "16.0" "$plist"
          done

          rm -rf Payload/ModShelf.app/_CodeSignature
          test -f Payload/ModShelf.app/THIRD_PARTY_NOTICES.md

          /usr/bin/codesign --force --deep --sign - --timestamp=none Payload/ModShelf.app
          /usr/bin/codesign --verify --deep --strict Payload/ModShelf.app

          /usr/bin/zip -qry ModShelf.ipa Payload
          /usr/bin/unzip -t ModShelf.ipa >/dev/null
          /usr/bin/unzip -Z1 ModShelf.ipa | grep -qx 'Payload/ModShelf.app/Info.plist'

          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/ModShelf.app/Info.plist)
          echo "app version: $APP_VERSION"
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "ERROR: the app says $APP_VERSION but this release is $VERSION."
            exit 1
          fi

          SIZE=$(stat -f%z ModShelf.ipa)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: IPA is only $SIZE bytes; it would not be installable."
            exit 1
          fi
          shasum -a 256 ModShelf.ipa

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NOTES:-}" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
          else
            printf 'Release v%s\n' "$VERSION" > release-notes.md
          fi
          cp ModShelf.ipa "ModShelf-v$VERSION.ipa"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "ModShelf v$VERSION" \
            --notes-file release-notes.md \
            "ModShelf-v$VERSION.ipa"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url

  source:
    name: Update the source and the badge
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check out the source repository
        uses: actions/checkout@v7
        with:
          repository: shplash/shplash-repo
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Read the release's IPA
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ASSET=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | endswith(".ipa")) | "\(.browser_download_url) \(.size)"' | head -n1)
          echo "url=${ASSET% *}" >> "$GITHUB_OUTPUT"
          echo "size=${ASSET##* }" >> "$GITHUB_OUTPUT"

      - name: Update apps.json
        env:
          ASSET_URL: ${{ steps.asset.outputs.url }}
          SIZE: ${{ steps.asset.outputs.size }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = os.environ["VERSION"].strip().lstrip("v")
          notes = os.environ.get("NOTES", "").strip()
          # The source shows its own "What's New" heading above the notes.
          notes = re.sub(r"^#{1,3}\s*What['’]s New\s*\n+", "", notes, flags=re.IGNORECASE).strip()
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          asset_url = os.environ["ASSET_URL"].strip()
          size = int(os.environ.get("SIZE", "0") or "0")

          with open("apps.json", encoding="utf-8") as handle:
              data = json.load(handle)

          for app in data.get("apps", []):
              if app.get("bundleIdentifier") != "com.shplash.modshelf":
                  continue
              app["version"] = version
              app["versionDate"] = stamp
              app["downloadURL"] = asset_url
              app["size"] = size
              if notes:
                  app["versionDescription"] = notes
              versions = [v for v in app.get("versions", []) if v.get("version") != version]
              versions.insert(0, {
                  "version": version,
                  "date": stamp,
                  "localizedDescription": notes,
                  "downloadURL": asset_url,
                  "size": size,
              })
              app["versions"] = versions

          with open("apps.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY
          git config user.name "shplash-bot"
          git config user.email "actions@github.com"
          git add apps.json
          git commit -m "Update ModShelf to $TAG" || exit 0
          git push

      - name: Check out the app repository
        uses: actions/checkout@v7
        with:
          path: app

      - name: Point the download badge at the release
        env:
          ASSET_URL: ${{ steps.asset.outputs.url }}
        run: |
          set -euo pipefail
          cd app
          python3 - <<'PY'
          import os
          import re
          import sys

          url = os.environ["ASSET_URL"]
          with open("README.md", encoding="utf-8") as handle:
              text = handle.read()
          pattern = r'(<a href=")([^"]+)(">\s*<img src="https://img\.shields\.io/badge/Download-IPA)'
          updated, count = re.subn(pattern, lambda m: m.group(1) + url + m.group(3), text, count=1)
          if count == 0:
              sys.exit("The download badge is not in README.md any more.")
          if updated != text:
              with open("README.md", "w", encoding="utf-8") as handle:
                  handle.write(updated)
          PY
          if git diff --quiet -- README.md; then
            echo "The badge already points at this release."
            exit 0
          fi
          git config user.name "shplash-bot"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Point the download badge at $TAG"
          git push
