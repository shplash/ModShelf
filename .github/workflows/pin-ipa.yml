name: Pin the release IPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to pin (defaults to the latest release)
        required: false

permissions:
  contents: write

jobs:
  pin:
    name: Give the release a stable IPA name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the release's IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "*.ipa" --dir dist --clobber
          ipa=$(find dist -maxdepth 1 -name '*.ipa' | head -n 1)
          test -n "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          ls -lh "$ipa"

      - name: Upload it as ModShelf.ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp "$IPA" ModShelf.ipa
          gh release upload "$TAG" ModShelf.ipa --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
