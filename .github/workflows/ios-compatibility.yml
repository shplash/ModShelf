
name: Steam Engine iOS Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialise gomobile
        run: gomobile init

      - name: Create engine bridge
        run: |
          mkdir -p ios-engine-test
          cd ios-engine-test
          go mod init example.com/iosenginetest

          cat > bridge.go <<'EOF'
          package iosenginetest

          import steam "github.com/BirknerAlex/go-steam"

          func EngineCompileCheck() string {
              _ = steam.New
              return "Steam engine linked"
          }
          EOF

      - name: Add dependencies
        working-directory: ios-engine-test
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          go get github.com/BirknerAlex/go-steam@latest
          go mod tidy

      - name: Compile Steam engine for iOS
        working-directory: ios-engine-test
        run: |
          gomobile bind -v -target=ios \
            -o ../SteamEngine.xcframework .

      - name: Verify framework
        run: |
          test -d SteamEngine.xcframework
          find SteamEngine.xcframework -maxdepth 3 -type f
