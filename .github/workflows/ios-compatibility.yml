
name: iOS Go Compatibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install gomobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialise gomobile
        run: gomobile init

      - name: Create minimal Go wrapper
        run: |
          mkdir -p ios-test
          cd ios-test
          go mod init example.com/iostest
          cat > bridge.go <<'EOF'
          package iostest

          func Greeting() string {
              return "iOS Go bridge works"
          }
          EOF

      - name: Add gomobile module dependency
        working-directory: ios-test
        run: go get -tool golang.org/x/mobile/cmd/gobind

      - name: Build iOS framework
        working-directory: ios-test
        run: |
          gomobile bind -v -target=ios \
            -o ../IOSBridge.xcframework .

      - name: Verify framework
        run: |
          test -d IOSBridge.xcframework
          find IOSBridge.xcframework -maxdepth 3 -type f
