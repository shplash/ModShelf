name: Engine cache

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-engine/**'
      - '.github/workflows/engine-cache.yml'

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

concurrency:
  group: engine-cache
  cancel-in-progress: false

jobs:
  build:
    name: Build the Steam engine for the cache
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Restore SteamEngine.xcframework
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: SteamEngine.xcframework
          key: steamengine-${{ runner.os }}-${{ hashFiles('ios-engine/**') }}
          restore-keys: steamengine-${{ runner.os }}-

      - name: Set up Go
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ios-engine/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: ios-engine/go.*

      - name: Install gomobile
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialise gomobile
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: gomobile init

      - name: Build the Steam engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: ios-engine
        run: |
          go get github.com/BirknerAlex/go-steam@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile bind -v -target=ios -o ../SteamEngine.xcframework .

      - name: Report
        run: |
          set -euo pipefail
          test -d SteamEngine.xcframework
          if [ "${{ steps.engine-cache.outputs.cache-hit }}" = "true" ]; then
            echo "The framework came from the cache."
          else
            echo "The framework was built and will be cached for the app builds."
          fi
