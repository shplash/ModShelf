name: Steam Engine

on:
  workflow_dispatch:
  # Weekly, so a change in go-steam upstream shows up before a build does.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-engine:
    name: Test the Go engine
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the go-steam source
        run: git clone --depth 1 https://github.com/BirknerAlex/go-steam.git engine

      # Go is set up after the clone so its module cache can be keyed on go.sum.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Download the dependencies
        working-directory: engine
        run: go mod download

      - name: Run the engine tests
        working-directory: engine
        run: go test ./...

      - name: Compile the engine packages
        working-directory: engine
        run: go build ./...
