name: Steam Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths:
      - 'ios-engine/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-engine:
    name: Test the Go engine
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the go-steam source
        run: git clone --depth 1 https://github.com/BirknerAlex/go-steam.git engine

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Download the dependencies
        working-directory: engine
        run: go mod download

      - name: Run the engine tests
        working-directory: engine
        run: go test ./...

      - name: Compile the engine packages
        working-directory: engine
        run: go build ./...
