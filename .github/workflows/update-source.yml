name: Update AltSource

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-source:
    name: Update the source entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source repository
        uses: actions/checkout@v7
        with:
          repository: shplash/shplash-repo
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Read the release's IPA
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" \
            --jq '.assets[] | select(.name | endswith(".ipa")) | "\(.browser_download_url) \(.size)"' | head -n1)
          echo "url=${ASSET% *}" >> "$GITHUB_OUTPUT"
          echo "size=${ASSET##* }" >> "$GITHUB_OUTPUT"

      - name: Update apps.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          PUBLISHED: ${{ github.event.release.published_at }}
          ASSET_URL: ${{ steps.asset.outputs.url }}
          SIZE: ${{ steps.asset.outputs.size }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import date

          tag = os.environ.get("TAG", "").strip()
          notes = os.environ.get("NOTES", "").strip()
          # The source shows its own "What's New" heading above the notes.
          notes = re.sub(r"^#{1,3}\s*What['’]s New\s*\n+", "", notes, flags=re.IGNORECASE).strip()
          published = os.environ.get("PUBLISHED", "").strip()
          asset_url = os.environ.get("ASSET_URL", "").strip()
          size = int(os.environ.get("SIZE", "0") or "0")
          if not tag.startswith("v"):
              print("No release tag on this run; nothing to do.")
              sys.exit(0)

          version = tag.lstrip("v")
          stamp = published or date.today().isoformat()
          download = asset_url or f"https://github.com/shplash/ModShelf/releases/latest"

          with open("apps.json", encoding="utf-8") as handle:
              data = json.load(handle)

          for app in data.get("apps", []):
              if app.get("bundleIdentifier") != "com.shplash.modshelf":
                  continue
              app["version"] = version
              app["versionDate"] = stamp
              app["downloadURL"] = download
              app["size"] = size
              if notes:
                  app["versionDescription"] = notes
              versions = [v for v in app.get("versions", []) if v.get("version") != version]
              versions.insert(0, {
                  "version": version,
                  "date": stamp,
                  "localizedDescription": notes,
                  "downloadURL": download,
                  "size": size,
              })
              app["versions"] = versions

          with open("apps.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY

      - name: Commit the change
        run: |
          set -euo pipefail
          git config user.name "shplash-bot"
          git config user.email "actions@github.com"
          git add apps.json
          git commit -m "Update ModShelf to ${{ github.event.release.tag_name }}" || exit 0
          git push
