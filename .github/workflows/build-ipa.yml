
name: Build Steam Workshop IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare Go dependencies
        working-directory: ios-engine
        run: |
          go get golang.org/x/mobile@latest
          go get github.com/BirknerAlex/go-steam@latest
          go mod tidy

      - name: Build Steam engine XCFramework
        working-directory: ios-engine
        run: |
          gomobile init
          gomobile bind -v -target=ios -o ../SteamEngine.xcframework .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project WorkshopDownloader.xcodeproj \
            -scheme WorkshopDownloader \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WorkshopDownloader.app"
          test -d "$APP_PATH" || {
            echo "ERROR: Built app not found at $APP_PATH"
            exit 1
          }

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload WorkshopDownloader.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopDownloader-IPA
          path: WorkshopDownloader.ipa
          if-no-files-found: error
