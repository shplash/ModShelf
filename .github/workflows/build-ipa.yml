name: Build Steam Workshop IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Steam engine XCFramework
        run: |
          gomobile init
          cd ios-engine
          go get github.com/BirknerAlex/go-steam@latest
          go mod tidy
          gomobile bind -v -target=ios -o ../SteamEngine.xcframework .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project WorkshopDownloader.xcodeproj \
            -scheme WorkshopDownloader \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WorkshopDownloader.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload WorkshopDownloader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopDownloader-IPA
          path: WorkshopDownloader.ipa
          if-no-files-found: error
