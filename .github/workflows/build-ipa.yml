name: Build ModShelf IPA

on:
  workflow_dispatch:
  # Every push that can change the app runs the build; documentation, licences and the
  # repository's own housekeeping files cannot, so they don't spend a Mac runner on it.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'

permissions:
  contents: write

# One build at a time: a second dispatch replaces the queued one instead of
# waiting behind it for a macOS runner.
concurrency:
  group: modshelf-ipa
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  # go-steam and x/mobile now ask for Go 1.26; allow setup-go to fetch it rather than
  # failing on the runner's default local toolchain.
  GOTOOLCHAIN: auto

jobs:
  build:
    name: Build and package the IPA
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history: the build number is the commit count, so a shallow clone would start at 1.
          fetch-depth: 0

      # The Go bind is the slowest part of this job, so the framework it
      # produces is reused until ios-engine changes.
      - name: Restore SteamEngine.xcframework
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: SteamEngine.xcframework
          key: steamengine-${{ runner.os }}-${{ hashFiles('ios-engine/**') }}

      - name: Set up Go
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          # The engine module states the Go version it needs, so it is never guessed here.
          go-version-file: ios-engine/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: ios-engine/go.*

      - name: Install gomobile
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # gomobile bind looks for the gobind binary that init sets up, so this has
      # to run before the bind even though gomobile is already installed.
      - name: Initialise gomobile
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: gomobile init

      - name: Build the Steam engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: ios-engine
        run: |
          go get github.com/BirknerAlex/go-steam@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile bind -v -target=ios -o ../SteamEngine.xcframework .

      # Runs even on a cache hit: gomobile writes MinimumOSVersion 100.0 into
      # the framework, and iOS refuses to install or launch an app that ships it.
      - name: Fix the engine framework's minimum OS version
        run: |
          set -euo pipefail
          test -d SteamEngine.xcframework
          patched=0
          # Every slice the framework carries, whatever gomobile named them this time.
          for framework in SteamEngine.xcframework/*/SteamEngine.framework; do
            [ -d "$framework" ] || continue
            plist="$framework/Info.plist"
            [ -f "$plist" ] || continue
            /usr/bin/plutil -replace MinimumOSVersion -string "16.0" "$plist"
            # The plist is part of the signature, so sign the slice again.
            /usr/bin/codesign --force --sign - --timestamp=none "$framework"
            echo "patched $framework -> $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
            patched=$((patched + 1))
          done
          if [ "$patched" -eq 0 ]; then
            echo "ERROR: no SteamEngine.framework slice was found to patch."
            exit 1
          fi

      - name: Restore the Homebrew cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-xcodegen
          restore-keys: homebrew-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify the source files
        run: |
          test -f project.yml
          test -f Sources/ContentView.swift
          test -f ios-engine/go.mod
          test -f ios-engine/bridge.go

      - name: Generate the Xcode project
        run: xcodegen generate

      # The build number is the commit count, so every commit gets its own build.
      - name: Set the build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Swift packages and the previous build are keyed on the sources, so a
      # rebuild after an app change still gets the warm DerivedData.
      - name: Restore Swift packages and build output
        uses: actions/cache@v6
        with:
          path: |
            build/SourcePackages
            build/Build
          key: xcodebuild-${{ runner.os }}-${{ hashFiles('project.yml', 'Sources/**') }}
          restore-keys: xcodebuild-${{ runner.os }}-

      - name: Build the app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ModShelf.xcodeproj \
            -scheme WorkshopDownloader \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package and sign the IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ModShelf.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App bundle not found: $APP_PATH"
            find build/Build/Products -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          rm -rf Payload ModShelf.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ModShelf.app

          # A stale build cache can hand back an app whose embedded engine still carries
          # gomobile's 100.0 minimum, so the copy that actually ships is corrected here too.
          for framework in Payload/ModShelf.app/Frameworks/*.framework; do
            [ -d "$framework" ] || continue
            plist="$framework/Info.plist"
            [ -f "$plist" ] || continue
            /usr/bin/plutil -replace MinimumOSVersion -string "16.0" "$plist"
          done

          rm -rf Payload/ModShelf.app/_CodeSignature

          # Ad-hoc signing: installers such as Feather and LiveContainer accept
          # the archive and re-sign it for their own device.
          /usr/bin/codesign --force --deep --sign - --timestamp=none Payload/ModShelf.app
          /usr/bin/codesign --verify --deep --strict Payload/ModShelf.app

          # An IPA is a zip with Payload/ at its root; zip keeps it readable by
          # every installer and by the Finder.
          /usr/bin/zip -qry ModShelf.ipa Payload

          echo "Checking the IPA archive..."
          /usr/bin/unzip -t ModShelf.ipa
          /usr/bin/unzip -Z1 ModShelf.ipa | head -20
          /usr/bin/unzip -Z1 ModShelf.ipa | grep -qx 'Payload/ModShelf.app/Info.plist'
          /usr/bin/unzip -Z1 ModShelf.ipa | grep -qx 'Payload/ModShelf.app/ModShelf'
          /usr/bin/unzip -Z1 ModShelf.ipa | grep -q '^Payload/ModShelf.app/_CodeSignature/'

          /usr/bin/plutil -p Payload/ModShelf.app/Info.plist | head -30

          # Fail here rather than on a device: an app or framework that asks for an iOS
          # version no phone has crashes the moment it launches.
          APP_MINIMUM=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/ModShelf.app/Info.plist 2>/dev/null || true)
          echo "app: MinimumOSVersion ${APP_MINIMUM:-unset}, CFBundleVersion $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/ModShelf.app/Info.plist)"
          if [ -n "$APP_MINIMUM" ] && [ "$APP_MINIMUM" != "16.0" ]; then
            echo "ERROR: the app asks for iOS $APP_MINIMUM."
            exit 1
          fi
          for framework in Payload/ModShelf.app/Frameworks/*.framework; do
            [ -d "$framework" ] || continue
            plist="$framework/Info.plist"
            [ -f "$plist" ] || continue
            minimum=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$plist" 2>/dev/null || true)
            echo "$(basename "$framework"): MinimumOSVersion ${minimum:-unset}"
            if [ -n "$minimum" ] && [ "$minimum" != "16.0" ]; then
              echo "ERROR: $(basename "$framework") asks for iOS $minimum."
              exit 1
            fi
          done

          SIZE=$(stat -f%z ModShelf.ipa)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: IPA is only $SIZE bytes; it would not be installable."
            exit 1
          fi
          shasum -a 256 ModShelf.ipa
          ls -lh ModShelf.ipa

      # Every run keeps its IPA as a real file on a draft release, which only people with write
      # access can see or download. Publishing is done by hand when a release is wanted.
      - name: Attach the IPA to the private build draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PLIST="build/Build/Products/Release-iphoneos/ModShelf.app/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          TAG="builds"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --title "ModShelf builds" \
              --notes "Draft release holding CI builds. It is never published, so only people with write access can see it." \
              --repo "$GITHUB_REPOSITORY"
          fi
          cp ModShelf.ipa "ModShelf-$VERSION-$BUILD.ipa"
          gh release upload "$TAG" "ModShelf-$VERSION-$BUILD.ipa" --clobber --repo "$GITHUB_REPOSITORY"
          # Keep only the newest build on the draft.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while read -r asset; do
              [ -z "$asset" ] && continue
              [ "$asset" = "ModShelf-$VERSION-$BUILD.ipa" ] && continue
              gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY" || true
            done

